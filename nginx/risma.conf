# Reverse proxy di Risma: unico punto d'ingresso dall'esterno. Termina
# HTTPS e smista le richieste: /api al backend Go, il resto al frontend
# Next.js. Browser, pagine e API restano sulla stessa origine.

upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:3000;
}

# HSTS obbliga il browser a usare sempre HTTPS per questo host. Non si invia
# per localhost: Chrome applicherebbe la regola a ogni porta di localhost,
# rendendo irraggiungibile anche il server di sviluppo su http://localhost:3000.
map $host $hsts_header {
    localhost   "";
    127.0.0.1   "";
    default     "max-age=31536000; includeSubDomains";
}

# Il token del link di reset password non deve finire nei log di accesso.
map $request_uri $loggable_request_uri {
    ~^/reset-password/  "/reset-password/[oscurato]";
    default             $request_uri;
}

log_format risma '$remote_addr [$time_local] "$request_method $loggable_request_uri $server_protocol" '
                 '$status $body_bytes_sent $request_time "$http_user_agent"';

# HTTP: solo reindirizzamento a HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log risma;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log risma;

    # Certificato generato da nginx/generate-cert.sh nel volume nginx_certs.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Stesso limite del backend (httpx.DecodeJSON): le API ricevono piccoli JSON.
    client_max_body_size 1m;

    # Header di sicurezza su tutte le risposte, anche di errore (always).
    #   CSP: risorse solo dallo stesso sito. 'unsafe-inline' per gli script
    #   serve agli script inline con cui Next.js idrata la pagina, per gli
    #   stili agli attributi style impostati da Chart.js; data: per il font
    #   incorporato nel CSS di Bootstrap Italia. Vedi docs/decisions.md.
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Il backend legge l'IP del client da X-Real-IP solo se la richiesta
    # arriva da nginx (TRUSTED_PROXIES). Il valore sovrascrive quello
    # eventualmente inviato dal client.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
